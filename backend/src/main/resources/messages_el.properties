Future.webinarInsertDTO.scheduledDate    = Η ημερομηνία διεξαγωγής πρέπει να είναι μελλοντική.
NotNull.webinarInsertDTO.duration        = Η διάρκεια είναι υποχρεωτική.
Positive.webinarInsertDTO.duration       = Η διάρκεια πρέπει να είναι θετικός αριθμός.
Min.webinarInsertDTO.duration            = Η ελάχιστη διάρκεια είναι {value} λεπτά.
Max.webinarInsertDTO.duration            = Η μέγιστη διάρκεια είναι {value} λεπτά.


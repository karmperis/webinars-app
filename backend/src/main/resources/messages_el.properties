Size.roleEditDTO.name     = Το όνομα του ρόλου πρέπει να περιέχει από {2} έως {1} χαρακτήρες.

NotBlank.roleInsertDTO.name = Το όνομα του ρόλου δεν μπορεί να είναι κενό.
Size.roleInsertDTO.name     = Το όνομα του ρόλου πρέπει να περιέχει από {2} έως {1} χαρακτήρες.


NotNull.userAdminEditDTO.active = Η κατάσταση ενεργοποίησης δεν μπορεί να είναι κενή.

# ------------------------------------------------------------
# UserEditDTO & UserInsertDTO
# ------------------------------------------------------------
NotBlank.userEditDTO.firstname = Το όνομα δεν μπορεί να είναι κενό.
Size.userEditDTO.firstname     = Το όνομα δεν πρέπει να υπερβαίνει τους {1} χαρακτήρες.
NotBlank.userEditDTO.lastname  = Το επώνυμο δεν μπορεί να είναι κενό.
Size.userEditDTO.lastname      = Το επώνυμο δεν πρέπει να υπερβαίνει τους {1} χαρακτήρες.
Size.userEditDTO.phoneNumber   = Το τηλέφωνο δεν πρέπει να υπερβαίνει τους {1} χαρακτήρες.
Pattern.userEditDTO.phoneNumber= Το τηλέφωνο πρέπει να περιέχει μόνο ψηφία, προαιρετικά να ξεκινά με '+' και να έχει μήκος 7-15 ψηφία.

NotNull.userInsertDTO.username   = Το όνομα χρήστη είναι υποχρεωτικό.
Size.userInsertDTO.username      = Το όνομα χρήστη πρέπει να περιέχει από {2} έως {1} χαρακτήρες.
NotNull.userInsertDTO.password   = Ο κωδικός πρόσβασης είναι υποχρεωτικός.
Pattern.userInsertDTO.password   = Ο κωδικός πρέπει να έχει μήκος τουλάχιστον 12 χαρακτήρες και να περιέχει τουλάχιστον ένα ψηφίο, ένα πεζό, ένα κεφαλαίο και έναν ειδικό χαρακτήρα.
NotNull.userInsertDTO.roleId     = Ο κωδικός ρόλου είναι υποχρεωτικός.
NotBlank.userInsertDTO.firstname = Το όνομα δεν μπορεί να είναι κενό.
Size.userInsertDTO.firstname     = Το όνομα δεν πρέπει να υπερβαίνει τους {1} χαρακτήρες.
NotBlank.userInsertDTO.lastname  = Το επώνυμο δεν μπορεί να είναι κενό.
Size.userInsertDTO.lastname      = Το επώνυμο δεν πρέπει να υπερβαίνει τους {1} χαρακτήρες.
Size.userInsertDTO.phoneNumber   = Το τηλέφωνο δεν πρέπει να υπερβαίνει τους {1} χαρακτήρες.
Pattern.userInsertDTO.phoneNumber= Το τηλέφωνο πρέπει να περιέχει μόνο ψηφία, προαιρετικά να ξεκινά με '+' και να έχει μήκος 7-15 ψηφία.


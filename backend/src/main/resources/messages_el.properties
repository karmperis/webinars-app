# ------------------------------------------------------------
# AuthenticationRequestDTO
# ------------------------------------------------------------
NotNull.authenticationRequestDTO.username = Το όνομα χρήστη είναι υποχρεωτικό.
NotNull.authenticationRequestDTO.password = Ο κωδικός πρόσβασης είναι υποχρεωτικός.

# ------------------------------------------------------------
# CapabilityEditDTO & CapabilityInsertDTO
# ------------------------------------------------------------
NotBlank.capabilityEditDTO.name     = Το όνομα του δικαιώματος δεν μπορεί να είναι κενό.
Size.capabilityEditDTO.name         = Το όνομα του δικαιώματος πρέπει να περιέχει από {2} έως {1} χαρακτήρες.
Size.capabilityEditDTO.description  = Η περιγραφή του δικαιώματος δεν μπορεί να υπερβαίνει τους {1} χαρακτήρες.

NotBlank.capabilityInsertDTO.name     = Το όνομα του δικαιώματος δεν μπορεί να είναι κενό.
Size.capabilityInsertDTO.name         = Το όνομα του δικαιώματος πρέπει να περιέχει από {2} έως {1} χαρακτήρες.
Size.capabilityInsertDTO.description  = Η περιγραφή του δικαιώματος δεν μπορεί να υπερβαίνει τους {1} χαρακτήρες.


# ============================================================
# Validation messages  -  English (default)
# Key format: {AnnotationName}.{modelAttributeName}.{fieldName}
# For @Size: {1}=max, {2}=min  (Spring passes attributes alphabetically)
# ============================================================

# ------------------------------------------------------------
# AuthenticationRequestDTO
# ------------------------------------------------------------
NotNull.authenticationRequestDTO.username = Username is required
NotNull.authenticationRequestDTO.password = Password is required

# ------------------------------------------------------------
# CapabilityEditDTO & CapabilityInsertDTO
# ------------------------------------------------------------
NotBlank.capabilityEditDTO.name     = The capability name cannot be blank.
Size.capabilityEditDTO.name         = The capability name must contain between {2} and {1} characters.
Size.capabilityEditDTO.description  = The capability description must contain maximum {1} characters.

NotBlank.capabilityInsertDTO.name     = The capability name cannot be blank.
Size.capabilityInsertDTO.name         = The capability name must contain between {2} and {1} characters.
Size.capabilityInsertDTO.description  = The capability description must contain maximum {1} characters.

# ------------------------------------------------------------
# RoleEditDTO & RoleInsertDTO
# ------------------------------------------------------------
NotBlank.roleEditDTO.name = The role name cannot be blank.
Size.roleEditDTO.name     = The role name must contain between {2} and {1} characters.

NotBlank.roleInsertDTO.name = The role name cannot be blank.
Size.roleInsertDTO.name     = The role name must contain between {2} and {1} characters.

# ------------------------------------------------------------
# UserAdminEditDTO
# ------------------------------------------------------------
NotNull.userAdminEditDTO.roleUuid = The role UUID cannot be null.
NotNull.userAdminEditDTO.active = The active status cannot be null.

# ------------------------------------------------------------
# UserEditDTO & UserInsertDTO
# ------------------------------------------------------------
NotBlank.userEditDTO.firstname = The firstname cannot be blank.
Size.userEditDTO.firstname     = The firstname must not exceed {1} characters.
NotBlank.userEditDTO.lastname  = The lastname cannot be blank.
Size.userEditDTO.lastname      = The lastname must not exceed {1} characters.
Size.userEditDTO.phoneNumber   = The phone number must not exceed {1} characters.
Pattern.userEditDTO.phoneNumber= The phone number must contain only digits, optionally starting with '+' (for international prefix), and be between 7 and 15 digits long.

NotNull.userInsertDTO.username   = The username cannot be null.
Size.userInsertDTO.username      = The username must contain between {2} and {1} characters.
NotNull.userInsertDTO.password   = The password cannot be null.
Pattern.userInsertDTO.password   = The password must be at least 12 characters long and contain at least one digit, one lowercase letter, one uppercase letter, and one special character.
NotNull.userInsertDTO.roleId     = The role_id cannot be null.
NotBlank.userInsertDTO.firstname = The firstname cannot be blank.
Size.userInsertDTO.firstname     = The firstname must not exceed {1} characters.
NotBlank.userInsertDTO.lastname  = The lastname cannot be blank.
Size.userInsertDTO.lastname      = The lastname must not exceed {1} characters.
Size.userInsertDTO.phoneNumber   = The phone number must not exceed {1} characters.
Pattern.userInsertDTO.phoneNumber= The phone number must contain only digits, optionally starting with '+' (for international prefix), and be between 7 and 15 digits long.

# ------------------------------------------------------------
# WebinarEditDTO & WebinarInsertDTO
# ------------------------------------------------------------
NotBlank.webinarEditDTO.title          = The webinar title cannot be blank.
Size.webinarEditDTO.title              = The webinar title must contain between {2} and {1} characters.
Size.webinarEditDTO.description        = The description cannot exceed {1} characters.
NotNull.webinarEditDTO.scheduledDate   = The scheduled date must be provided.
Future.webinarEditDTO.scheduledDate    = The scheduled date must be in the future.
NotNull.webinarEditDTO.duration        = The duration must be provided.
Positive.webinarEditDTO.duration       = The duration must be a positive number.
Min.webinarEditDTO.duration            = The minimum duration is {value} minutes.
Max.webinarEditDTO.duration            = The maximum duration is {value} minutes.

NotBlank.webinarInsertDTO.title          = The webinar title cannot be blank.
Size.webinarInsertDTO.title              = The webinar title must contain between {2} and {1} characters.
Size.webinarInsertDTO.description        = The description cannot exceed {1} characters.
NotNull.webinarInsertDTO.scheduledDate   = The scheduled date must be provided.
Future.webinarInsertDTO.scheduledDate    = The scheduled date must be in the future.
NotNull.webinarInsertDTO.duration        = The duration must be provided.
Positive.webinarInsertDTO.duration       = The duration must be a positive number.
Min.webinarInsertDTO.duration            = The minimum duration is {value} minutes.
Max.webinarInsertDTO.duration            = The maximum duration is {value} minutes.

